<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balltvsa.com - Cyber Security Portal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="main-container">
        <!-- 🔒 ส่วนสำหรับ Login / Register (แสดงเมื่อยังไม่ล็อกอิน) -->
        <div id="auth-section" class="panel">
            <h2>🔒 IDENTITY VERIFICATION</h2>
            <div id="auth-msg" class="message" style="display:none;"></div>
            
            <div class="form-group">
                <label>Username / Agent ID</label>
                <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้">
            </div>
            
            <div class="form-group">
                <label>Security Code / Password</label>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน">
            </div>

            <button class="btn" onclick="handleLogin()">เข้าสู่ระบบ (Login)</button>
            <button class="btn btn-secondary" onclick="handleRegister()">ลงทะเบียนใหม่ (Register)</button>
        </div>

        <!-- 🛡️ ส่วน Agent Dashboard (แสดงเมื่อล็อกอินแล้ว) -->
        <div id="dashboard-section" class="panel hidden">
            <h2>🛡️ AGENT DASHBOARD</h2>
            
            <div class="user-card">
                <h3 id="display-name" style="color: #fff; margin-bottom: 5px;">-</h3>
                <span class="status-badge">VERIFIED AGENT</span>
                <p style="margin-top: 10px; font-size: 14px;">คะแนนสูงสุด (High Score): <strong id="high-score" style="color: #3fb950;">0</strong></p>
            </div>

            <!-- ⚡ เพิ่มส่วนปุ่ม Click ฝึกความไวกลับมาตรงนี้ -->
            <div class="game-box">
                <h4>⚡ Speed Clicker Training</h4>
                <p style="font-size: 12px; color: #8b949e; margin: 6px 0 12px;">กดปุ่มเพื่อเพิ่มคะแนนและบันทึกเข้า Supabase!</p>
                <h2 id="current-score" style="font-size: 28px; color: #fff; margin-bottom: 12px;">0</h2>
                <button class="click-btn" onclick="addPoint()">CLICK!</button>
                <button class="btn btn-secondary" style="margin-top: 12px;" onclick="saveScore()">💾 บันทึกคะแนนลง Database</button>
            </div>

            <div class="leaderboard-box">
                <h3>🏆 AGENTS LEADERBOARD</h3>
                <div id="leaderboard-list">กำลังโหลดข้อมูล...</div>
            </div>

            <button class="btn btn-danger" onclick="logout()">ออกจากระบบ (Logout)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
