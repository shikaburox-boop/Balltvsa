<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังก่อสร้าง Web</title>
  <!-- CSS แยกไฟล์ -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <div class="icon">🛠️</div><br>
    <h1>⚠️  Web กำลังก่อสร้าง ⚠️</h1>
    <p class="subtitle">🚨 อยู่ในช่วงใช้ความคิด 🧠</p>

    <!-- ฟอร์มส่งไอเดีย -->
    <form id="ideaForm">
      <label for="ideaText" class="form-label">ส่งไอเดียได้ (ถ้ามี):</label>
      <textarea id="ideaText" rows="4" required placeholder="อยากให้เว็บเป็นเว็ปอะไรดี...."></textarea>
      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <!-- ข้อความแจ้งเตือนสถานะ -->
    <p id="statusMsg" class="status-msg"></p>
  </div>

  <!-- Angle Grinder -->
  <img id="grinder" src="grinder.png" alt="angle grinder" draggable="false">
  <canvas id="sparks"></canvas>
  <audio id="grinderSound" src="/Angle Grinder Sound Effect (HD).mp3" loop preload="auto"></audio>
  <script src="grinder.js"></script>

  <script>
    // ตั้งค่าการเชื่อมต่อ Supabase ของคุณ
    const SUPABASE_URL = 'https://saxvncakpljuzyhhuqcv.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNheHZuY2FrcGxqdXp5aGh1cWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjI3NDgsImV4cCI6MjEwNzYzODc0OH0.OJqvx5cvJ3VMcPFsOZ7o1PsrtI_6Wzgo_4Wds_k9Hfk'; 

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('ideaForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const idea = document.getElementById('ideaText').value.trim();

      submitBtn.disabled = true;
      submitBtn.textContent = 'กำลังส่ง...';

      // ส่งข้อมูลเข้า Table ชื่อ 'ideas' ใน Supabase
      const { data, error } = await supabaseClient
        .from('ideas')
        .insert([{ message: idea }]);

      if (error) {
        console.error('Error:', error);
        statusMsg.textContent = '❌ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
        statusMsg.className = 'status-msg error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit';
      } else {
        statusMsg.textContent = '✨ Thankkkkkk Q!';
        statusMsg.className = 'status-msg success';
        form.reset();
        submitBtn.disabled = false;
        submitBtn.textContent = 'ส่งไอเดีย 🚀';
      }
    });
  </script>
</body>
</html>
