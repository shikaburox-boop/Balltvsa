<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule · Academic & Personal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="workspace">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-title">Schedule</span>
        <span class="brand-sub">Academic & Personal</span>
      </div>

      <!-- Google Login -->
      <section class="auth-section">
        <div id="g_id_onload"
             data-client_id="939767735796-7rbfgjv0bc1fpqk0dlck9rj2u192ppge.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div id="loginContainer" class="login-container">
          <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="medium" data-logo_alignment="left"></div>
        </div>
        <div id="userInfo" class="user-info" style="display: none;">
          <img id="userAvatar" src="" alt="User Avatar" class="user-avatar">
          <div class="user-details">
            <span id="userName" class="user-name"></span>
            <button id="logoutBtn" type="button" class="btn-logout">Sign Out</button>
          </div>
        </div>
      </section>

      <!-- Main Event Form -->
      <section class="form-section">
        <form id="appointmentForm" class="entry-form">
          
          <div class="field-row">
            <div class="field">
              <label for="eventDate">Start Date</label>
              <input type="text" id="eventDate" placeholder="Select date" readonly required>
            </div>
            <div class="field">
              <label for="eventEndDate">End Date</label>
              <input type="text" id="eventEndDate" placeholder="Select date" readonly>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="eventStartTime">Start Time</label>
              <input type="text" id="eventStartTime" placeholder="Select time" readonly required>
            </div>
            <div class="field">
              <label for="eventEndTime">End Time</label>
              <input type="text" id="eventEndTime" placeholder="Select time" readonly required>
            </div>
          </div>
          
          <div class="field">
            <label for="eventTitle">Title</label>
            <input type="text" id="eventTitle" placeholder="Lecture, exam, task" autocomplete="off" required>
          </div>
          
          <div class="field">
            <label for="eventDetails">Notes</label>
            <input type="text" id="eventDetails" placeholder="Room, link, or extra info" autocomplete="off">
          </div>

          <div class="field">
            <label>Color Tag</label>
            <div class="color-picker">
              <label class="color-option"><input type="radio" name="eventColor" value="purple" checked><span class="color-swatch color-purple"></span></label>
              <label class="color-option"><input type="radio" name="eventColor" value="blue"><span class="color-swatch color-blue"></span></label>
              <label class="color-option"><input type="radio" name="eventColor" value="green"><span class="color-swatch color-green"></span></label>
              <label class="color-option"><input type="radio" name="eventColor" value="orange"><span class="color-swatch color-orange"></span></label>
              <label class="color-option"><input type="radio" name="eventColor" value="red"><span class="color-swatch color-red"></span></label>
            </div>
          </div>

          <button type="submit" id="addBtn" class="btn-primary">Add Event</button>
        </form>
      </section>

      <!-- Quick Stickers Section -->
      <section id="dragPresetsSection" class="drag-presets-section" style="display: none;">
        <div class="section-label-row">
          <span class="section-label">Quick stickers</span>
          <button id="toggleStickerFormBtn" class="btn-icon" type="button" title="Create sticker">+</button>
        </div>

        <form id="stickerForm" class="sticker-form" style="display: none;">
          <input type="text" id="stickerTitle" placeholder="Sticker title" required>
          <input type="text" id="stickerDetails" placeholder="Notes (optional)">
          
          <div class="field-row" style="margin-bottom: 4px;">
            <div class="field" style="flex: 1; margin-bottom: 0;">
              <label style="font-size: 0.65rem; margin-bottom: 2px;">Hours</label>
              <select id="stickerHours" class="color-select-small">
                <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
              </select>
            </div>
            <div class="field" style="flex: 1; margin-bottom: 0;">
              <label style="font-size: 0.65rem; margin-bottom: 2px;">Minutes</label>
              <select id="stickerMinutes" class="color-select-small">
                <option value="0">00</option><option value="15">15</option><option value="30">30</option><option value="45">45</option>
              </select>
            </div>
          </div>

          <div class="field" style="margin-bottom: 6px;">
            <div class="color-picker" style="justify-content: space-between; padding: 0 4px;">
              <label class="color-option"><input type="radio" name="stickerColor" value="purple" checked><span class="color-swatch color-purple"></span></label>
              <label class="color-option"><input type="radio" name="stickerColor" value="blue"><span class="color-swatch color-blue"></span></label>
              <label class="color-option"><input type="radio" name="stickerColor" value="green"><span class="color-swatch color-green"></span></label>
              <label class="color-option"><input type="radio" name="stickerColor" value="orange"><span class="color-swatch color-orange"></span></label>
              <label class="color-option"><input type="radio" name="stickerColor" value="red"><span class="color-swatch color-red"></span></label>
            </div>
          </div>

          <button type="submit" class="btn-small" style="width: 100%;">Create Sticker</button>
        </form>

        <div class="preset-chips" id="presetChipsContainer"></div>
      </section>

      <!-- Agenda Section -->
      <section class="agenda-section">
        <div class="section-head" style="margin-top: 8px;">
          <span>Ongoing</span>
          <span id="ongoingCount" class="count-tag">0</span>
        </div>
        <ul id="ongoingList" class="agenda-list" style="max-height: 120px;"></ul>

        <div class="section-head" style="margin-top: 12px;">
          <span>Upcoming</span>
          <span id="upcomingCount" class="count-tag">0</span>
        </div>
        <ul id="upcomingList" class="agenda-list"></ul>
      </section>
    </aside>

    <!-- Main Calendar -->
    <main class="calendar-view">
      <div id="monthView" class="view-panel active">
        <header class="calendar-toolbar">
          <h1 id="monthYearDisplay" class="month-title">—</h1>
          <div class="nav-group">
            <button id="prevBtn" class="btn-nav" type="button">Previous</button>
            <button id="nextBtn" class="btn-nav" type="button">Next</button>
          </div>
        </header>

        <div class="calendar-board">
          <div class="weekdays-row">
            <div>Sun</div><div>Mon</div><div>Tue</div>
            <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
          </div>
          <div id="daysContainer" class="days-grid"></div>
        </div>
      </div>

      <div id="dayDetailView" class="view-panel" style="display: none;">
        <header class="day-toolbar">
          <button id="backToMonthBtn" class="btn-nav" type="button">← Back to Month</button>
          <div class="day-badge-header">
            <span id="detailDayName" class="day-name-label">Day</span>
            <div id="detailDayCircle" class="day-circle-badge">0</div>
          </div>
        </header>

        <div id="allDayBanner" class="all-day-banner"></div>

        <div class="timeline-scroll">
          <div id="timelineGrid" class="timeline-grid"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- ✅ Custom Date Picker Modal -->
  <div id="datePickerModal" class="dp-modal">
    <div class="dp-overlay"></div>
    <div class="dp-content">
      <div class="dp-header">
        <button type="button" class="dp-prev">&lsaquo;</button>
        <span id="dpMonthYear">October 2026</span>
        <button type="button" class="dp-next">&rsaquo;</button>
      </div>
      <div class="dp-weekdays">
        <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
      </div>
      <div id="dpDays" class="dp-days"></div>
    </div>
  </div>

  <!-- ✅ Custom Time Picker Modal (Wheel Style) -->
  <div id="timePickerModal" class="tp-modal">
    <div class="tp-overlay"></div>
    <div class="tp-content">
      <div class="tp-display">
        <input type="text" id="tpHourInput" class="tp-time-input" inputmode="numeric" maxlength="2" value="09" autocomplete="off" aria-label="Hour (00-23)">
        <span class="tp-colon">:</span>
        <input type="text" id="tpMinInput" class="tp-time-input" inputmode="numeric" maxlength="2" value="00" autocomplete="off" aria-label="Minute (00-59)">
      </div>
      <div class="tp-wheel-container">
        <div class="tp-highlight-bar"></div>
        
        <div class="tp-wheel" id="wheelHour">
          <div class="tp-wheel-spacer"></div>
          <div class="tp-wheel-spacer"></div>
        </div>
        
        <div class="tp-wheel-colon">:</div>

        <div class="tp-wheel" id="wheelMinute">
          <div class="tp-wheel-spacer"></div>
          <div class="tp-wheel-spacer"></div>
        </div>

      </div>
      <button type="button" id="tpDoneBtn" class="tp-done">Done</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
